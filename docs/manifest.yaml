schema_version: 1
module_id: maplibui
repository_id: maplibui
maturity: maintained
last_verified: 2026-09-12
entrypoints:
  - maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
  - maplibui/src/main/java/com/nextgis/maplibui/service/LayerFillService.java
  - maplibui/src/main/java/com/nextgis/maplibui/activity/SelectNGWResourceActivity.java
key_components:
  - path: maplibui/src/main/java/com/nextgis/maplibui/service/WalkGeometryInsertion.java
    responsibility: Keep walked nodes at the selected insertion position and refine only the last vertex owned by the current recording session.
  - path: maplibui/src/main/java/com/nextgis/maplibui/overlay/CurrentTrackOverlay.java
    responsibility: Keep active track segment boundaries through Canvas draw, pan and zoom.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/ExportGPXTask.java
    responsibility: Export persisted GNSS segments as separate GPX trkseg elements in insertion order.
  - path: maplibui/build.gradle
    responsibility: Compile MapLibre UI against the same explicit MapLibre 13.0.2 OpenGL artifact as app and maplib so the final runtime does not require Vulkan.
  - path: maplibui/src/main/java/com/nextgis/maplibui/dialog/NGWResourcesListAdapter.java
    responsibility: Load NGW resource trees asynchronously and report connection failures only through a live Activity window without crashing after lifecycle transitions.
  - path: maplibui/src/main/java/com/nextgis/maplibui/activity/NGWLoginActivity.java
    responsibility: Complete Web GIS login only after Android AccountManager returns the created variant-specific account; keep recoverable local failures visible.
  - path: maplibui/src/main/java/com/nextgis/maplibui/service/RebuildCacheService.java
    responsibility: Rebuild vector cache with mobile or Collector notification behavior selected by the application contract rather than package name.
  - path: maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
    responsibility: Application-level map lifecycle, active-project database binding, fill, schema rebuild and removal orchestration; backup-gated pre-sync collapse of duplicate managed layer identities with one map commit; resume a durable Collector journal only in its matching project, clean only app-marked unpublished layer stages, defer heavy account-sync reloads, and keep post-fill map reload pending until MapLibre confirms style/source application.
  - path: maplibui/src/main/java/com/nextgis/maplibui/service/LayerFillService.java
    responsibility: Non-sticky foreground NGW/Collector layer download and local GeoJSON/KML/GPX/raster MBTiles fill, target-project identity verification before file or SQLite access, early parent binding to the owning workspace, Collector-item edit policy application, crash-tracked fail-fast cleanup of incomplete layers, durable timeout recovery, one-commit main-thread replacement scoped by account/project/resource with post-commit storage retirement, and ordered local-underlay insertion above OSM and below the user stack.
  - path: maplibui/src/main/java/com/nextgis/maplibui/mapui/LayerFactoryUI.java
    responsibility: Route local GeoJSON, KML, GPX, NGRc and raster MBTiles documents to their matching fill task while preserving the standard layer naming dialog.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/NGWResourceImportHelper.java
    responsibility: Route a URL-resolved vector or raster resource into the existing fill and map-reload pipeline.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorProjectRegistry.java
    responsibility: Before the first map open, create and activate the initial local workspace or non-destructively adopt the legacy standalone map; atomically persist, recover, create, rename, activate and device-delete isolated Web GIS/local projects with schema-v2 sidecars, operation-aware import preparation and main-thread fallback opening after backup-gated deletion.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/LegacyMapWorkspaceCopier.java
    responsibility: Copy only the legacy map config, referenced layer directories and track database into the initial isolated workspace while rejecting path traversal and retaining the source as rollback.
  - path: maplibui/src/main/java/com/nextgis/maplibui/activity/SelectNGWResourceActivity.java
    responsibility: Browse and import NGW resources, showing a readable modal wait message when Collector workspace preparation is blocked by synchronization or layer loading.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/ProjectOperationCoordinator.java
    responsibility: Hold one active workspace across sync/fill/rebuild stages and make project switch/create/rename/delete plus Debug underlay migration mutually exclusive with database background work.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/SchemaRebuildRetryGuard.java
    responsibility: Circuit-break unchanged heavy NGW schema rebuilds per workspace/account/resource while allowing an explicit project-settings reset.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorProjectImportHelper.java
    responsibility: Keep Activity and Dialog initial Collector imports identical across vector and supported raster-style items.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorRasterLayerHelper.java
    responsibility: Create and update authenticated project-managed read-only raster layers for already-supported QGIS style resources.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorImportJournal.java
    responsibility: Persist unfinished Collector batches for verify-and-repair after process death.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/LayerFillStaging.java
    responsibility: Mark unpublished layer directories and clean only marked unreferenced stages plus their owning-workspace tables after process death, preserving referenced and every unmarked legacy directory.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/CollectorFormFileTransaction.java
    responsibility: Install or recover the form and metadata sidecars as one validated transaction.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/LayerBackupManager.java
    responsibility: Export layer tables and only attachment files physically present on this device before destructive rebuild or removal, without downloading server-only payloads.
  - path: maplibui/src/main/java/com/nextgis/maplibui/service/TrackerService.java
    responsibility: Keep ordered Start/Stop and durable recording intent in the application process; consume shared validated GNSS, decimate after filtering, persist segment boundaries, flush only validated points and retain an unfinished track on unexpected termination; explicit Stop closes the track and clears durable intent.
  - path: maplibui/src/main/java/com/nextgis/maplibui/service/WalkEditService.java
    responsibility: Consume shared validated GNSS, persist geometry and insertion target with gps_paused, require explicit reconnection after GPS loss or draft recovery, and flush the final durable snapshot before Save without a raw-location tail.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/BackgroundRecordingSoundMonitor.java
    responsibility: Consume the shared validated GNSS stream before geometry sampling, use measurement age for the ten-second background heartbeat, rely on source-owned recording wake lock and retain existing alarm/vibration and persistence-failure feedback.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/BackgroundRecordingSoundPolicy.java
    responsibility: Provide Android-independent fresh-location gating, alarm-volume output selection, 10-second heartbeat throttling and one-minute persistence-failure throttling for background recording feedback.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/FeatureFormDraftStore.java
    responsibility: Persist typed form control state, geometry and pending photo paths until explicit Save or Discard.
  - path: maplibui/src/main/java/com/nextgis/maplibui/util/GeometryEditDraftStore.java
    responsibility: Persist the latest non-walk geometry with map/layer/feature identity until explicit completion or Discard.
  - path: maplibui/src/main/java/com/nextgis/maplibui/overlay/EditLayerOverlay.java
    responsibility: Build the first sketch node from the current MapLibre camera centre, convert line and polygon screen vertices through the current MapLibre projection, orchestrate manual/walk edit toolbars against the visible selected-to-successor insertion target, and route the active-walk walking-person action to the existing Save/Stop callback instead of location settings.
  - path: maplibui/src/main/java/com/nextgis/maplibui/overlay/UndoRedoOverlay.java
    responsibility: Retain up to 100 coordinate-distinct geometry snapshots for sketch and ruler workflows, ignore CRS-only callback differences when allocating steps, and move Undo or Redo by exactly one real edit without corrupting history at its boundaries.
  - path: maplibui/src/main/java/com/nextgis/maplibui/overlay/RulerOverlay.java
    responsibility: Retain measurement-mode lifecycle and legacy canvas fallback state; the active MapLibre ruler geometry and Undo/Redo snapshots are owned by MapDrawable and the app host.
  - path: maplibui/src/main/java/com/nextgis/maplibui/activity/ModifyAttributesActivity.java
    responsibility: Attribute form and photo attachment processing, including shared enabled-by-default coordinate-overlay preferences and a successful result carrying layer, feature and new-row identity so the app host can terminate editing and clear selection.
  - path: maplibui/src/main/java/com/nextgis/maplibui/activity/VectorLayerSettingsActivity.java
    responsibility: Preserve NGW synchronization direction on no-op layer-settings visits and allow Collector-owned editable layers to recover from server-only mode without reimport.
  - path: maplibui/src/main/res/menu/edit_polygon.xml
    responsibility: Keep Polygon and MultiPolygon tap-sketch actions visible without overflow or touch append and omit part/hole mutation actions.
  - path: maplibui/src/main/java/com/nextgis/maplibui/display/RuleFeatureRendererUI.java
    responsibility: Rule-based style editor UI; other/default style naming and cloning new categories from other.
  - path: maplibui/src/main/java/com/nextgis/maplibui/mapui/SyncAccountWorker.java
    responsibility: Schedule per-account sync work while delegating transient per-layer pull retries to the maplib account adapter.
public_contracts:
  - id: gis-application
    symbol: GISApplication implements IGISApplication
    path: maplibui/src/main/java/com/nextgis/maplibui/GISApplication.java
    consumers: [app, maplib]
  - id: ngw-resource-url-import
    symbol: NGWResourceImportHelper
    path: maplibui/src/main/java/com/nextgis/maplibui/util/NGWResourceImportHelper.java
    consumers: [app]
